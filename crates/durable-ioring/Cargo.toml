[package]
name = "durable-ioring"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "Epoch-based durability for a file-I/O ring, portable: the contract, the core that decides when writes are durable and what a failure puts at risk, the target and backend traits, an in-memory backend, and a conformance oracle. Drivers supply the platform; win-durable-ioring is the Windows one. No unsafe code."
readme = "COMPONENT.md"

[dependencies]
# The buffer contract the core's signatures name (`IoBuf`, `IoBufMut`, `RegisteredSpan`), which is
# portable, so this crate has no platform dependency (DI-D-50). The version is the one io-buffers'
# first release is fixed to (`Release-As: 0.1.0`), so it is not a guess.
io-buffers = { version = "0.1.0", path = "../io-buffers" }
# A fault's report, a static or a shared `dyn Error` (DI-D-105): the shared form needs `unsafe`, which
# this crate forbids, so it lives below. release-please's workspace plugin moves this version with
# rc-errors' first release.
rc-errors = { version = "0.0.2", path = "../rc-errors" }
# The core's keyed tables, whose capacity is declared at construction and which refuse an insert
# past it rather than grow (DI-D-106, DI-D-107). Heap storage, allocated once when the core is
# built. release-please's workspace plugin moves this version with fixed-hash-table's first release.
fixed-hash-table = { version = "0.0.2", path = "../fixed-hash-table", features = ["alloc"] }

[features]
default = ["std"]
# What needs `std` (DI-D-97), on by default; without it the crate is `no_std` and uses `alloc`. The
# rest of the core names `core` and `alloc` paths, so what this feature covers is what is spelled
# `std::`: the driver's locking (the engine, its lock watch and the pumped delivery), the
# conformance oracle and its recorder, which share state under a lock, `StderrDiagnostics`, the
# conversions to and from `io::Error`, the in-memory notification's parking wait, and the
# `thread::panicking()` guard on an inconsistency.
std = []
# Every call in the core that can allocate names itself with a tag; this feature keeps the thread's
# current tag so an allocator can read it (DI-D-104). Only the allocation test turns it on, through
# the dev-dependency below; without it, tagging compiles to nothing. Needs `std`, for the thread-local.
alloc-tags = ["std"]

[dev-dependencies]
# The crate's own tests use its `alloc-tags` feature, as `win-debugging-sys` does for `test-util`. A
# dev-dependency's features reach test builds only.
durable-ioring = { path = ".", features = ["alloc-tags"] }
