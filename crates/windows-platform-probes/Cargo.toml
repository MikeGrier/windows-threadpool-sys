[package]
name = "windows-platform-probes"
version = "0.0.1"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Executable probes for the Windows behaviour this workspace's designs rest on -- supported, documented APIs, in the specific cases their documentation does not describe."

[lib]
path = "src/lib.rs"

[features]
# Binds the report oracle inside the renderers for INTEGRATION test builds.
#
# `cfg(test)` covers the unit tests, but cargo compiles this library as an
# ordinary dependency -- without `cfg(test)` -- for anything under `tests/`, so
# the binding does not reach them. Measured: an integration test rendered a
# report whose banner architecture contradicted its NDJSON and did not panic.
# This feature closes that for the explicit integration-test target below.
#
# Never enable it for a shipping build. A real probe run must PRINT a
# self-contradicting report rather than panic: the contradiction is a finding
# about the probe, and a fleet survey needs the NDJSON row rather than a crash.
#
# **`--all-features` enables it, and cargo offers no stable way to prevent that.**
# So `cargo build --all-features` produces probe binaries that assert -- verified
# by inspecting them for the panic string. That matters here because this
# workspace does use `--all-features`, for cargo-mutants runs. The boundary is
# stated rather than claimed away: the DEFAULT build is the one that carries the
# print-rather-than-panic guarantee.
# Pulls in `serde_json` because the oracle's well-formedness check IS a real
# parse. See the `[dependencies]` entry for why that is not hand-written.
oracle-in-renderer = ["dep:serde_json", "dep:serde"]

[[bin]]
name = "probe-error-mode"
path = "src/bin/error_mode.rs"

[[bin]]
name = "probe-handle-state"
path = "src/bin/handle_state.rs"

[[bin]]
name = "probe-worker-context"
path = "src/bin/worker_context.rs"

[[bin]]
name = "probe-cancel-io"
path = "src/bin/cancel_io.rs"

[[bin]]
name = "probe-completion-port"
path = "src/bin/completion_port.rs"

[[bin]]
name = "probe-device-map"
path = "src/bin/device_map.rs"

[[bin]]
name = "probe-ioring"
path = "src/bin/ioring.rs"

[[bin]]
name = "probe-pool-growth"
path = "src/bin/pool_growth.rs"

[[bin]]
name = "probe-topology"
path = "src/bin/topology.rs"

[[bin]]
name = "probe-doorbell-cost"
path = "src/bin/doorbell_cost.rs"

[[bin]]
name = "probe-request-cost"
path = "src/bin/request_cost.rs"

[[bin]]
name = "probe-queue-contention"
path = "src/bin/queue_contention/main.rs"

# These two are the same code, and that is the measurement: they differ only in
# whether `build.rs` embeds the `longPathAware` manifest, which is not a runtime
# switch and so cannot be a flag on one binary.
[[bin]]
name = "probe-long-path-aware"
path = "src/bin/long_path_aware.rs"

[[bin]]
name = "probe-long-path-unaware"
path = "src/bin/long_path_unaware.rs"

[[test]]
name = "a_real_report_agrees_with_itself"
path = "tests/a_real_report_agrees_with_itself.rs"
required-features = ["oracle-in-renderer"]

[dependencies]
# **Optional, and reached only through `oracle-in-renderer`.** The report
# oracle's job is to answer "would a consumer be able to parse this row", and
# the honest way to answer that is to PARSE IT with the kind of parser a
# consumer uses. This replaced a hand-written structural check.
#
# That check was not obviously wrong; it had been through a review, which
# strengthened it after finding it accepted `{"a":1,}`. Then a generated test --
# 1807 single-character corruptions of a real row, judged against this crate --
# found **159 more disagreements, every one a false accept**: a stray backslash
# forming an invalid escape, a missing `:`, a `,` where a `:` belonged. Closing
# the last of those meant tracking whether an object expects a name or a value,
# which is a JSON parser. So the choice was to write one or to depend on one.
#
# It is NOT in the default build, because the oracle is not: the gate here is
# the same one at the call sites in `topology_report`, and a shipping probe must
# print a self-contradicting report rather than panic on it. The module itself
# carries the gate, which is also the clearest statement of what that module is.
serde_json = { version = "1.0", optional = true }
# **Every workspace dependency below is path-only, with no `version`**, because
# this crate is never distributed at all -- not to a registry, and not as a
# released binary either, unlike `windows-placement-probe` next door. These
# probes are a development instrument, run from a checkout, and `publish = false`
# above is the whole story.
#
# A `version` beside a `path` is consulted only when the depending crate is
# packaged, but cargo still requires the path crate's own version to satisfy it
# at every build -- so a pin left behind by a bump breaks the whole workspace's
# resolution rather than only this crate's.
#
# The pool-growth probe measures the shipping API rather than a
# reimplementation of the SDK's inline environment helpers, so it depends on the
# real crate.
windows-threadpool-sys = { path = "../windows-threadpool-sys" }
# Same reason: the topology probe measures what the shipping parse produces, not
# a second parse written here, which would only measure itself. The raw Win32
# counters it cross-checks against are read independently through windows-sys.
windows-topology-sys = { path = "../windows-topology-sys" }
# Every probe's report opens with a line naming the machine that produced it and
# whether the measurement is tainted, so a captured finding cannot be pasted
# somewhere and compared against something it does not describe. That banner is
# `windows-placement-probe`'s to render, not a second copy here.
windows-placement-probe = { path = "../windows-placement-probe" }
# The request-cost probe measures the real request type the design would put on
# a queue, not a stand-in, for the same reason the topology probe reads the
# shipping parse: a reimplementation would measure the reimplementation.
windows-namespace-request-sys = { path = "../windows-namespace-request-sys" }
# The contention probe measures the shipping queue shapes rather than a
# reimplementation, for the same reason: a stand-in would only measure itself,
# and the whole question is what the real tail claim costs.
#
# The experimental permit claim is enabled here because this probe is what
# decides its fate (SH-15.5): it must be measured against the shipping shapes on
# the same host, in the same run, by the same harness.
windows-waitable-queues = { path = "../windows-waitable-queues", features = [
	"experimental-permit-claim",
] }
# The long-path probe measures a length against `MAX_PATH`, and `MAX_PATH` counts
# UTF-16 code units. `OsStr::len` counts Rust's platform encoding -- WTF-8 here --
# so the two disagree the moment a non-ASCII character appears in `%TEMP%`, which
# would put an attempt on the wrong side of the ceiling the probe exists to
# characterize. This crate holds a string in the encoding Windows uses, so its
# `len` is the number under test rather than a conversion of one.
#
# That is the whole of what it is used for here: a code-unit count, at every site
# where a length is compared against a Windows limit.
# `encode_wide().count()` would give the same number, and the choice of this crate
# over that is a vocabulary one -- the workspace's own WTF-16 type naming the
# quantity rather than an ad-hoc count that happens to agree.
wtf-string = { path = "../wtf-string" }
# Beside `serde_json`, and gated with it, for ONE reason: `keys` must report the
# row's top-level names in ORDER and WITH DUPLICATES, and a parsed map can give
# neither -- `serde_json::Map` sorts, and silently keeps the last of a repeated
# key, which is the very defect `RowDefect::RepeatedKey` exists to report. A
# `MapAccess` visitor sees the names as the parser reads them, so the scan is
# still the real parser's and this crate hand-writes no string walking at all.
serde = { version = "1.0", optional = true }

# The 128-bit claim layout is measured only where a 128-bit exchange is a native
# instruction, and the feature that supplies it is added per-target rather than
# unconditionally.
#
# This is not a tuning choice, it is the queue crate's `D-18`/`D-37` contract:
# `dwcas` is non-default precisely so `reserving_mpsc`'s narrow word ships on
# every target while the wide one ships only where it is genuinely lock-free.
# `i686-pc-windows-msvc` has no 128-bit atomic at all, and `D-18` records that
# the workspace deliberately keeps that target supported -- so enabling `dwcas`
# from here without a target gate would propagate through feature unification and
# fail the i686 build in the queue crate (`cannot find AtomicU128 in
# portable_atomic`). Measured, not assumed: that is the exact error this gate was
# added to remove.
#
# `target_has_atomic = "128"` would be the WRONG condition -- `D-37` records that
# rustc emits it even with `cmpxchg16b` disabled, and that is measured here:
# `rustc --print cfg --target x86_64-pc-windows-msvc -C target-feature=-cmpxchg16b`
# still prints `target_has_atomic="128"` while dropping
# `target_feature="cmpxchg16b"`. So the feature is the discriminator, and the
# x86-64 branch tests it: naming the architecture alone would enable `dwcas` on a
# build with the instruction switched off, where `AtomicU128` does not exist and
# the queue crate fails to compile. aarch64 needs no such test -- `ldxp`/`stxp` is
# ARMv8-A baseline and requires no target feature.
#
# `src/queue_contention.rs` gates the `Wide` rows on the SAME conditions. The two
# must agree; the source side names this comment so a reader changing one finds
# the other.
[target.'cfg(all(target_arch = "x86_64", target_feature = "cmpxchg16b"))'.dependencies]
windows-waitable-queues = { path = "../windows-waitable-queues", features = [
	"dwcas",
] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
windows-waitable-queues = { path = "../windows-waitable-queues", features = [
	"dwcas",
] }

[dev-dependencies]
# Here because [tests/a_real_report_agrees_with_itself.rs] uses `serde_json`
# DIRECTLY, to empty the row's diagnostic lists by parsing and re-rendering
# rather than by cutting the text.
#
# **Not to satisfy `report_oracle`'s gate, which an earlier version of this
# comment claimed.** The integration test that needs that gate is instead
# declared explicitly above with `required-features = ["oracle-in-renderer"]`,
# so ordinary unit-test builds keep exercising the `cfg(test)` arm while that
# one target runs with the feature on.
serde = "1.0"
serde_json = "1.0"

[dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	# SetCurrentDirectoryW, for the long-path probe: the current directory is
	# half of what a relative path resolves against, so the probe has to place
	# it deliberately rather than inherit whatever launched it.
	"Win32_System_Environment",
	"Win32_System_Diagnostics_Debug",
	"Win32_System_IO",
	"Win32_System_Pipes",
	# GetSystemDirectoryW, so the request probe measures the real system
	# directory instead of assuming Windows is installed on C:.
	"Win32_System_SystemInformation",
	"Win32_System_SystemServices",
	"Win32_System_Threading",
]
