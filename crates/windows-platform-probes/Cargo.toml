[package]
name = "windows-platform-probes"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Executable probes for the undocumented Windows behaviour this workspace's designs rest on."

[lib]
path = "src/lib.rs"

[[bin]]
name = "probe-core-affinity"
path = "src/bin/core_affinity.rs"

[[bin]]
name = "probe-error-mode"
path = "src/bin/error_mode.rs"

[[bin]]
name = "probe-handle-state"
path = "src/bin/handle_state.rs"

[[bin]]
name = "probe-worker-context"
path = "src/bin/worker_context.rs"

[[bin]]
name = "probe-cancel-io"
path = "src/bin/cancel_io.rs"

[[bin]]
name = "probe-completion-port"
path = "src/bin/completion_port.rs"

[[bin]]
name = "probe-device-map"
path = "src/bin/device_map.rs"

[[bin]]
name = "probe-ioring"
path = "src/bin/ioring.rs"

[[bin]]
name = "probe-pool-growth"
path = "src/bin/pool_growth.rs"

[[bin]]
name = "probe-doorbell-cost"
path = "src/bin/doorbell_cost.rs"

[[bin]]
name = "probe-request-cost"
path = "src/bin/request_cost.rs"

[[bin]]
name = "probe-topology"
path = "src/bin/topology.rs"

[[bin]]
name = "probe-queue-contention"
path = "src/bin/queue_contention.rs"

[[bin]]
name = "probe-peer-index-cache"
path = "src/bin/peer_index_cache.rs"

[dependencies]
# The pool-growth probe measures the shipping API rather than a
# reimplementation of the SDK's inline environment helpers, so it depends on the
# real crate.
windows-threadpool-sys = { version = "0.1.3", path = "../windows-threadpool-sys" }
# Same reason: the topology probe measures what the shipping parse produces, not
# a second parse written here, which would only measure itself. The raw Win32
# counters it cross-checks against are read independently through windows-sys.
windows-topology-sys = { version = "0.1.0", path = "../windows-topology-sys" }
# The placement measurement moved out to its own crate so it could be shared
# with people running it on hardware this workspace does not own. The probes
# here call into it rather than keeping a second copy: two renderings of one
# measurement disagreeing is a defect this investigation has already hit.
windows-placement-probe = { version = "0.1.0", path = "../windows-placement-probe" }
# The request-cost probe measures the real request types the design would put on
# a queue, not a stand-in, for the same reason.
windows-namespace-request-sys = { version = "0.2.0", path = "../windows-namespace-request-sys" }
# The contention probe measures the shipping queue shapes rather than a
# reimplementation, for the same reason: a stand-in would only measure itself,
# and the whole question is what the real tail claim costs.
windows-waitable-queues = { version = "0.1.0", path = "../windows-waitable-queues" }
wtf-string = { version = "0.1.0", path = "../wtf-string" }

[dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	# GetSystemDirectoryW, so the request probe measures the real system
	# directory instead of assuming Windows is installed on C:.
	"Win32_System_SystemInformation",
	"Win32_System_Diagnostics_Debug",
	"Win32_System_IO",
	"Win32_System_Pipes",
	"Win32_System_SystemServices",
	"Win32_System_Threading",
]
