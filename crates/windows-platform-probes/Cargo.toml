[package]
name = "windows-platform-probes"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Executable probes for the undocumented Windows behaviour this workspace's designs rest on."

[lib]
path = "src/lib.rs"

[[bin]]
name = "probe-error-mode"
path = "src/bin/error_mode.rs"

[[bin]]
name = "probe-handle-state"
path = "src/bin/handle_state.rs"

[[bin]]
name = "probe-worker-context"
path = "src/bin/worker_context.rs"

[[bin]]
name = "probe-cancel-io"
path = "src/bin/cancel_io.rs"

[[bin]]
name = "probe-completion-port"
path = "src/bin/completion_port.rs"

[[bin]]
name = "probe-device-map"
path = "src/bin/device_map.rs"

[[bin]]
name = "probe-ioring"
path = "src/bin/ioring.rs"

[[bin]]
name = "probe-pool-growth"
path = "src/bin/pool_growth.rs"

[dependencies]
# The pool-growth probe measures the shipping API rather than a
# reimplementation of the SDK's inline environment helpers, so it depends on the
# real crate.
windows-threadpool-sys = { version = "0.1.3", path = "../windows-threadpool-sys" }

[dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Diagnostics_Debug",
	"Win32_System_IO",
	"Win32_System_Pipes",
	"Win32_System_SystemServices",
	"Win32_System_Threading",
]
