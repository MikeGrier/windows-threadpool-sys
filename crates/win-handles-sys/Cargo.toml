[package]
name = "win-handles-sys"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Memory-safe Rust over the Win32 handle and object API: duplicating a handle with a chosen access, with a typed access mask. Thin over Win32, adding no policy."
keywords = ["windows", "handle", "duplicatehandle", "ffi"]
categories = ["api-bindings", "os::windows-apis"]

# Named under the workspace's `win-` prefix decision (DESIGN-NOTES.md at the repository root), and
# placed by the rule that follows it: a safe layer more or less directly over a Win32 API area, and
# the area is the one Microsoft Learn files the functions under, System Services > Windows System
# Information > Handles and Objects (WIN32-LEARN-MAP.md at the repository root).

[dependencies]
# `default-features = false` matches every other crate in the workspace.
#
# `Win32_Foundation` is `DuplicateHandle` and the handle types. `Win32_System_Threading` is
# `GetCurrentProcess` and the two access rights `Access` names, `SYNCHRONIZE` and
# `EVENT_MODIFY_STATE`.
[dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = ["Win32_Foundation", "Win32_System_Threading"]

# Test-only. What a duplicate can do is observed through raw calls on events and a mutex, which
# `CreateEventW` and `CreateMutexW` make; `Win32_Security` is there only because their attributes
# parameter is a `SECURITY_ATTRIBUTES` pointer and the binding is gated on it.
[dev-dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"]

[package.metadata.docs.rs]
# The crate is Windows-only, so docs.rs must build on a Windows target or it
# would render an almost-empty crate.
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
