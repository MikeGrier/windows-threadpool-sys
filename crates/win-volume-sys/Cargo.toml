[package]
name = "win-volume-sys"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Memory-safe Rust over the Win32 volume device controls: the disks a volume sits on, the sector size it is addressed in, and its lock. Thin over Win32, adding no policy."
keywords = ["windows", "volume", "disk", "ioctl", "ffi"]
categories = ["api-bindings", "os::windows-apis", "filesystem"]

# Named under the workspace's `win-` prefix decision (DESIGN-NOTES.md at the repository root): a
# safe layer more or less directly over a Win32 API area, the volume device controls.

[dependencies]
# The Win32 error code, so an error from a control carries its code exactly, including a code of
# 2^31 or more, which std's `io::Error` holds as a negative number.
win-error-codes = { version = "0.0.2", path = "../win-error-codes" }

# The dependency query's names are `Wtf16String`s, copied out of the reply and owned; a reply is read
# from an aligned buffer, `io_buffers::AlignedBuf`, because the structure holds pointers.
wtf-string = { version = "0.1.0", path = "../wtf-string" }
io-buffers = { version = "0.1.0", path = "../io-buffers" }

# `default-features = false` matches every other crate in the workspace.
#
# `Win32_System_IO` is `DeviceIoControl` and `GetOverlappedResult`; `Win32_System_Ioctl` is
# `DISK_GEOMETRY`, `DISK_EXTENT`, `VOLUME_DISK_EXTENTS` and the `FSCTL_*` and `IOCTL_DISK_*`
# codes; `Win32_Storage_FileSystem` is `IOCTL_VOLUME_GET_VOLUME_DISK_EXTENTS`. `Win32_System_Threading`
# is the event a call waits on, and `Win32_Security` is there only because `CreateEventW`'s
# attributes parameter is a `SECURITY_ATTRIBUTES` pointer. `Win32_Storage_Vhd` is
# `GetStorageDependencyInformation` and the structures it fills.
windows-sys = { version = "0.61.2", default-features = false, features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_Storage_Vhd",
	"Win32_System_IO",
	"Win32_System_Ioctl",
	"Win32_System_Threading",
] }

# Test-only. The named pipe whose overlapped read pends on demand, which is how the device-control
# helper's pending path is run (`device_control/tests.rs`), is made with `win-pipes-sys`.
# Path-only, with no `version`: Cargo checks a pinned version against the path at every build, so a
# release of that crate would break this one, and a versionless dev-dependency is left out of the
# published manifest (see `windows-ioring-sys`'s manifest).
[dev-dependencies]
win-pipes-sys = { path = "../win-pipes-sys" }

[dev-dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = ["Win32_Foundation"]

[package.metadata.docs.rs]
# The crate is Windows-only, so docs.rs must build on a Windows target or it
# would render an almost-empty crate.
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
