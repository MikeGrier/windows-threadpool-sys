[package]
name = "windows-overlapped-io-sys"
version = "0.1.0" # x-release-please-version
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/windows-overlapped-io-sys"
readme = "README.md"
description = "Owned overlapped I/O endpoints and pinned operations for Windows IOCP and thread-pool completion."
keywords = ["windows", "overlapped", "iocp", "async", "ffi"]
categories = ["api-bindings", "os::windows-apis"]

[lib]
path = "src/lib.rs"

[dependencies]
windows-sys = {
	version = "0.61.2",
	default-features = false,
	features = ["Win32_Foundation", "Win32_System_IO"],
}

# Extra windows-sys features used only by tests that issue real overlapped I/O.
# These stay out of the published crate's feature set for downstream consumers.
[dev-dependencies]
windows-sys = {
	version = "0.61.2",
	default-features = false,
	features = [
		"Win32_Foundation",
		"Win32_System_IO",
		"Win32_Security",
		"Win32_Storage_FileSystem",
		"Win32_System_Pipes",
	],
}
