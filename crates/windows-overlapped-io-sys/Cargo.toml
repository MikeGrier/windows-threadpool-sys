[package]
name = "windows-overlapped-io-sys"
version = "1.0.0" # x-release-please-version
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/windows-overlapped-io-sys"
readme = "README.md"
description = "Owned overlapped I/O endpoints and pinned operations for Windows IOCP and thread-pool completion."
keywords = ["windows", "overlapped", "iocp", "async", "ffi"]
categories = ["api-bindings", "os::windows-apis"]

[lib]
path = "src/lib.rs"

# The crate is Windows-only and its safe adapters are feature-gated, so docs.rs
# must build on a Windows target with every feature enabled or it would render an
# almost-empty crate.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[features]
# The default build carries only the core completion machinery: the raw IOCP
# backend, the blocking backend, owned endpoints, and pinned operations. That
# needs just Win32_Foundation + Win32_System_IO (declared as direct dependency
# features below), so the published default feature set stays empty.
default = []

# Operation-family features widen the windows-sys binding surface for one family
# of overlapped operations. Downstream crates and this crate's future safe
# operation adapters opt into exactly the families they use; enabling a family
# never changes the completion machinery, only which native calls are in scope.
fs = ["windows-sys/Win32_Storage_FileSystem"]
socket = ["windows-sys/Win32_Networking_WinSock"]
device = ["windows-sys/Win32_System_Ioctl"]

# Capture a full backtrace at each operation submission so the drop-time
# diagnostic can point at the source of any operation still outstanding. The
# capture itself honors RUST_BACKTRACE / RUST_LIB_BACKTRACE at run time.
operation-backtrace = []

[dependencies]
windows-sys = {
	version = "0.61.2",
	default-features = false,
	features = ["Win32_Foundation", "Win32_System_IO"],
}

# Extra windows-sys features used only by tests that issue real overlapped I/O.
# These stay out of the published crate's feature set for downstream consumers.
[dev-dependencies]
windows-sys = {
	version = "0.61.2",
	default-features = false,
	features = [
		"Win32_Foundation",
		"Win32_System_IO",
		"Win32_Security",
		"Win32_Storage_FileSystem",
		"Win32_System_Pipes",
	],
}
