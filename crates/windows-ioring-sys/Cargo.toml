# Copyright (c) 2026 Mike Grier

[package]
name = "windows-ioring-sys"
version = "0.3.0" # x-release-please-version
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/windows-ioring-sys"
description = "Memory-safe Rust over the Windows IoRing submission/completion ring, with zero-allocation buffer handoff."
readme = "README.md"
keywords = ["windows", "ioring", "io-uring", "async", "ffi"]
categories = ["api-bindings", "os::windows-apis", "filesystem"]

[lib]
path = "src/lib.rs"

[features]
default = ["threadpool"]

# A test-support seam that makes a *real* completion report a failure it did
# not actually have (M16.3). Off by default: it is for testing failure
# handling, and nothing in production has a use for it.
#
# It is safe to enable -- it cannot cause undefined behaviour, only a wrong
# answer from `Completion::result` -- because it transforms a completion the
# ring genuinely popped rather than fabricating one. That distinction is the
# whole design and is argued in full on `Completion::with_injected_failure`.
# Fabrication stays `#[cfg(test)] pub(crate)` and is not reachable from here.
fault-injection = []
# Model A delivery (`EventDelivery`) is the only thing in this crate that needs
# a thread pool, so a Model B consumer -- a pinned thread parked in
# `Batch::submit_and_wait`, owning its own ring -- otherwise links a dependency
# it never calls (D-22). Default-on keeps the gate additive: no existing
# consumer is affected, and opting out is `default-features = false`.
#
# The justification is layering, not runtime cost: linking
# `windows-threadpool-sys` creates no threads, because the Win32 default pool is
# a process-wide facility instantiated lazily on first use. A ring wrapper simply
# does not intrinsically depend on a thread pool.
threadpool = ["dep:windows-threadpool-sys"]

# `--no-default-features` drops `EventDelivery`, which this example is entirely
# about, so declare the requirement rather than letting the build break. Cargo
# skips the example instead of failing to compile it.
[[example]]
name = "model_a_delivery"
path = "examples/model_a_delivery.rs"
required-features = ["threadpool"]

# M14.2 gives the epoch-log sample a thread-pool control plane, so from that
# point it needs the feature too. Before M14.2 it built under
# `--no-default-features`; the `ioring-no-threadpool` CI job from M11.4 would
# have reported the change as a build failure rather than a skip without this.
[[example]]
name = "epoch_log"
path = "examples/epoch_log/main.rs"
required-features = ["threadpool"]

# The crate is Windows-only, so docs.rs must build on a Windows target or it
# would render an almost-empty crate.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
# The IoRing entry points and types live under `Win32_Storage_FileSystem`, not
# under `Win32_System_IO` as their subject matter might suggest.
# `Win32_System_Threading` supplies the event primitives the Model A delivery
# path (M4) waits on.
windows-sys = { version = "0.61.2", default-features = false, features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
	"Win32_System_Threading",
] }
# The Model A delivery path (M4): a `ThreadpoolWait` on the ring's completion
# event. Optional behind the default-on `threadpool` feature (D-22); nothing
# else in the crate references it.
windows-threadpool-sys = { version = "0.1.3", path = "../windows-threadpool-sys", optional = true }

[dev-dependencies]
# M6.3's topology-guidance example enumerates L3 cache domains with this
# crate rather than raw `GetLogicalProcessorInformationEx` calls. M7's
# ring-copy sample additionally needs the `serde` feature, to load a fed-in
# topology description (D-10 in windows-topology-sys's DESIGN-NOTES.md).
windows-topology-sys = { version = "0.2.0", path = "../windows-topology-sys", features = [
	"serde",
] }
# M7's ring-copy sample deserializes a fed-in topology description (--topology).
serde_json = "1.0"
# M7's ring-copy sample additionally needs `VirtualAllocExNuma` (buffer
# placement) and `GROUP_AFFINITY` (pinned-thread affinity); M14.1's epoch-log
# sample needs `Win32_System_Ioctl` for the `FSCTL_SET_ZERO_DATA` reclamation
# it orders against ring epochs. The library itself needs none of them.
windows-sys = { version = "0.61.2", default-features = false, features = [
	"Win32_System_Ioctl",
	"Win32_System_Memory",
	"Win32_System_SystemInformation",
] }
# M14.1's epoch-log sample orders a non-ring `FSCTL` against ring epochs, which
# `IOSQE_FLAGS_DRAIN_PRECEDING_OPS` cannot express (D-24 orders SQEs against
# SQEs). The `device` feature supplies the `DeviceIoControl` adapter.
windows-overlapped-io-sys = { version = "0.1.3", path = "../windows-overlapped-io-sys", features = [
	"device",
] }

# M15.1's guard-page allocator, installed by the integration tests that
# exercise registered buffers. Test instrumentation only -- it is
# `publish = false` and deliberately never reuses an address, which is correct
# for a test binary and wrong for anything that runs for long.
windows-guard-alloc = { path = "../windows-guard-alloc" }
