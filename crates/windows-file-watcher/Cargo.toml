[package]
name = "windows-file-watcher"
version = "0.1.0" # x-release-please-version
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/windows-file-watcher"
description = "Memory-safe ReadDirectoryChangesW notification decoding for a Windows path-change watcher (in development)."
keywords = ["windows", "filesystem", "notify", "watcher", "ffi"]
categories = ["api-bindings", "os::windows-apis", "filesystem"]

[lib]
path = "src/lib.rs"

[features]
# Exposes the interim M2 internals (the directory watcher and its crate-owned
# queue) as a `#[doc(hidden)]` module so this crate's own integration tests can
# drive the arm/complete/re-arm loop end to end. Not semver-covered, and deleted
# together with the module when M3's `Monitor`/`Session`/`Watch` surface lands.
unstable-internals = []

# The M2 loop's overflow and teardown behaviour is only observable at a scale the
# unit tests should not carry, and the loop is not reachable from the crate's
# public surface, which deliberately ships only the decoder until M3.
[[test]]
name = "watcher_loop"
path = "tests/watcher_loop.rs"
required-features = ["unstable-internals"]

# The crate is Windows-only, so docs.rs must build it on a Windows target or it
# would resolve to an empty crate and document nothing.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
# The owned overlapped-I/O foundation. Directory reads are issued through its
# submission seam, and its generation-stamped `OperationId` keeps a stale
# completion from being misattributed to the next read that reuses the same
# `OVERLAPPED` across a re-arm. No features are enabled; only the core completion
# machinery is needed.
windows-overlapped-io-sys = { version = "1.0.0", path = "../windows-overlapped-io-sys", default-features = false }

# The thread pool the monitor runs on: `ThreadpoolIo` services detailed reads,
# `ThreadpoolWait` the coarse fallback, `ThreadpoolTimer` the retry backoff, and
# `ThreadpoolWork` drains the request queue. The monitor owns no threads of its
# own.
windows-threadpool-sys = { version = "1.0.0", path = "../windows-threadpool-sys" }

# Relative names decoded from `ReadDirectoryChangesW` are native `u16`, and are
# handed back to Windows APIs as `u16`. Storing them as `Wtf16String` keeps them
# in that representation end to end, so neither direction pays the WTF-8
# re-encode an `OsString` would impose. Default features are kept: the `std`
# feature is what supplies the lossless `OsStr` interop the public surface
# promises (D-8).
wtf-string = { version = "0.2.0", path = "../wtf-string" }

windows-sys = {
	version = "0.61.2",
	default-features = false,
	# Win32_Security is needed only for the SECURITY_ATTRIBUTES parameter named in
	# the CreateFileW signature used to open a watched directory; the crate always
	# passes a null pointer for it.
	features = [
		"Win32_Foundation",
		"Win32_Security",
		"Win32_Storage_FileSystem",
		"Win32_System_IO",
	],
}

# Integration tests exercise the decoder against a buffer produced by a real
# overlapped ReadDirectoryChangesW call, which needs binding surface the
# published crate does not itself use. `Win32_System_Threading` supplies the
# event + bounded wait the test uses so the worker can never block forever, and
# `Win32_Security` supplies the `SECURITY_ATTRIBUTES` type named in the
# `CreateEventW` / `CreateFileW` signatures -- declared here rather than relied on
# transitively through `windows-threadpool-sys`.
[dev-dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
	"Win32_System_Threading",
] }
