[package]
name = "win-etw-sys"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Memory-safe Rust over the Win32 Event Tracing provider functions: register a provider, ask whether a session is listening, write an event from typed fields, and unregister when dropped. Thin over Win32, adding no policy."
keywords = ["windows", "etw", "tracing", "events", "ffi"]
categories = ["api-bindings", "os::windows-apis", "development-tools::debugging"]

# Named by the engineer, 2026-10-20 ("win-etw-sys is good"), under the workspace's `win-` prefix decision
# (DESIGN-NOTES.md at the repository root), and placed as a safe layer more or less directly over a Win32 API
# area, the one Microsoft Learn documents the functions in: Event Tracing, under Windows Events (WE-D-1).

[dependencies]
# The failure a call reports, as the one type the workspace's crates give a Win32 code.
win-error-codes = { version = "0.0.2", path = "../win-error-codes" }

# `default-features = false` matches every other crate in the workspace.
#
# `Win32_System_Diagnostics_Etw` is `EventRegister`, `EventUnregister`, `EventWrite`, `EventEnabled`,
# `EventProviderEnabled` and the two structures they take.
[dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = ["Win32_System_Diagnostics_Etw"]

[features]
# A trace session a test starts, enables a provider in, and reads back (WE-D-3), for a test to see what a provider's
# events are when they reach a session. Off by default: it is a test facility and not a wrapper of the session functions,
# and starting a session needs privilege.
#
# `Win32_Foundation` is `FILETIME`, which `ProcessTrace` takes, and the error codes.
# `Win32_System_Time` is `TIME_ZONE_INFORMATION`, which the log file's header structure holds.
# The session functions and structures are `Win32_System_Diagnostics_Etw`, which the crate has already.
test-util = ["windows-sys/Win32_Foundation", "windows-sys/Win32_System_Time"]

[dev-dependencies]
# The crate's own tests use its `test-util` feature, as `win-durable-ioring` does for `fault-injection`.
win-etw-sys = { path = ".", features = ["test-util"] }

[package.metadata.docs.rs]
# The crate is Windows-only, so docs.rs must build on a Windows target or it
# would render an almost-empty crate.
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
