[package]
name = "windows-threadpool-sys"
version = "0.1.4" # x-release-please-version
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/windows-threadpool-sys"
readme = "README.md"
description = "Memory-safe access to the Windows thread pool APIs."
keywords = ["windows", "threadpool", "asynchronous", "ffi"]
categories = ["api-bindings", "os::windows-apis"]

[lib]
path = "src/lib.rs"

# The crate is Windows-only, so docs.rs must build it on a Windows target or it
# would fail to compile the thread-pool bindings entirely.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
# The shared overlapped-I/O foundation: owned endpoints, pinned operations, and the
# submission seam (`into_overlapped` / `from_overlapped` / `reclaim_overlapped`) that
# the `TP_IO` backend builds on. Published independently, so both a path (for the
# workspace) and a version (for consumers building from crates.io) are required. No
# features are enabled (`default-features = false`): the `TP_IO` backend needs only
# the core completion machinery, not any operation-family adapter (fs, socket, device).
windows-overlapped-io-sys = { version = "0.1.3", path = "../windows-overlapped-io-sys", default-features = false }

[features]
default = ["self-heal"]

# Repairs a pool that a cancellation may have left unable to make its first
# worker, by submitting a work item to it -- the one action measured to release
# that stall every time. On by default, and the reason `try_cancel_pending` can
# be a safe method at all: see README-FEATURE-self-heal.md for what it costs and
# what to watch for if you turn it off.
#
# Turning it off removes `try_cancel_pending` rather than changing what it
# means, so a consumer who relied on it gets a compile error naming the
# `unsafe` sibling to reach for instead.
self-heal = []

# A trace for defects that only appear under concurrency. Off by default and
# absent from the compiled output when off, because the instrument for that
# class of problem must not change the schedule it is measuring.
#
# It pulls two extra `windows-sys` features in with it, for the vectored
# exception handler the trace installs when it is switched on at run time.
# `AddVectoredExceptionHandler` and `EXCEPTION_POINTERS` are both gated on
# `Win32_System_Kernel` as well as on the `Debug` module they live in. Both are
# enabled only with this feature, so a consumer who never traces never
# compiles them.
trace = [
	"windows-sys/Win32_System_Diagnostics_Debug",
	"windows-sys/Win32_System_Kernel",
	"windows-sys/Win32_System_Diagnostics_ToolHelp",
	"windows-sys/Win32_System_LibraryLoader",
	"windows-sys/Win32_System_Memory",
	# `Win32_System_IO` is for the positive control on the completion-port
	# depth scan, which posts a known number of packets to a port it makes
	# itself and requires the scan to report that number back. The scan itself
	# reaches `NtQueryIoCompletion` through `GetProcAddress`, so this is a
	# test-only need rather than one the instrument has.
	"windows-sys/Win32_System_IO",
]
[dependencies.windows-sys]
version = "0.61.2"
default-features = false
# Win32_Security is needed only for the SECURITY_ATTRIBUTES parameter of
# CreateEventW, which backs the safe WaitableHandle::event constructor.
features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_IO",
	"Win32_System_Threading",
]

# The TP_IO tests issue real overlapped I/O against a named pipe, which needs
# binding surface the published crate itself does not use.
[dev-dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = [
	"Win32_Foundation",
	"Win32_System_IO",
	"Win32_System_Threading",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Pipes",
]
