[package]
name = "windows-threadpool-sys"
version = "0.1.0" # x-release-please-version
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/windows-threadpool-sys"
readme = "README.md"
description = "Memory-safe access to the Windows thread pool APIs."
keywords = ["windows", "threadpool", "asynchronous", "ffi"]
categories = ["api-bindings", "os::windows-apis"]

[lib]
path = "src/lib.rs"

[dependencies]
# The shared overlapped-I/O foundation: owned endpoints, pinned operations, and the
# submission seam (`into_overlapped` / `from_overlapped` / `reclaim_overlapped`) that
# the `TP_IO` backend builds on. Published independently, so both a path (for the
# workspace) and a version (for consumers building from crates.io) are required. The
# default feature set is used; the `TP_IO` backend needs only the core completion
# machinery, not any operation-family adapter.
windows-overlapped-io-sys = { version = "0.1.0", path = "../windows-overlapped-io-sys", default-features = false }

windows-sys = {
	version = "0.61.2",
	default-features = false,
	features = ["Win32_System_IO", "Win32_System_Threading"],
}
