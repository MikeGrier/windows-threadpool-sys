[package]
name = "win-durable-ioring"
version = "0.3.2"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A ring for Windows file I/O with durability scheduled into its work: writes are tagged with epochs, and durability through an epoch is requested and reported in the ring's own completion stream. The Windows driver for durable-ioring, built on windows-ioring-sys. No unsafe code."
readme = "README.md"

[dependencies]
# The contract, the core and the traits this crate drives and implements (DI-D-50). A version and a
# path, as `cargo publish` requires: the version is the release that carries the split.
durable-ioring = { version = "0.2.0", path = "../durable-ioring" }
# The ring crate (DI-D-16 in durable-ioring's DESIGN-NOTES.md): the release that carries the typed
# ring, `leave_queued` and the registrations this driver is built on.
windows-ioring-sys = { version = "0.8.0", path = "../windows-ioring-sys" }
# The file target's type (DI-D-29): a consumer's file is a `SharedHandle`, and this crate hands that
# same handle to the ring, which takes the type directly.
win-shared-os-owned-handle = { version = "0.1.0", path = "../win-shared-os-owned-handle" }
# The readiness signal's type (DI-D-28): an `Event`, so a front end can hand it to a thread-pool
# wait without `unsafe`.
win-sync-sys = { version = "0.0.2", path = "../win-sync-sys" }
# The thread-pool wait the drain and the readiness check wait through. It needs
# `From<Event> for WaitableHandle`, which this release carries.
windows-threadpool-sys = { version = "0.3.0", path = "../windows-threadpool-sys" }
# This driver's one time base, interrupt time (DI-D-37), read through `InterruptClock`: the crate
# forbids `unsafe`, so it cannot call `QueryInterruptTime` itself.
win-time-sys = { version = "0.1.0", path = "../win-time-sys" }
# The disks a raw volume sits on, its sector size and its lock: device controls that need `unsafe`,
# which this crate forbids (DI-D-61).
win-volume-sys = { version = "0.1.1", path = "../win-volume-sys" }
# The open of a file (DI-13.2): every parameter of `CreateFileW`, made safe and decided by no one,
# so what an open means is decided here and this crate has no `unsafe` of its own for it. The
# handle it returns is plain and unassociated, as the ring needs.
windows-namespace-request-sys = { version = "0.5.0", path = "../windows-namespace-request-sys" }
# The path type that crate takes, and the flags and access constants an open is made from.
wtf-string = { version = "0.1.0", path = "../wtf-string" }
# The security descriptor a created file is given (DI-14.3), taken from the crate Microsoft Learn
# files it under, and read back from an open handle by the tests (DI-14.8.5). It was the request
# crate's until DI-14.8.1 moved it.
win-authorization-sys = { version = "0.1.0", path = "../win-authorization-sys" }
# `DuplicateHandle`, which the readiness event's wait-only copy is made with (DI-7.5), taken from
# the crate Microsoft Learn files it under, and the flags of a handle, which the tests read back
# (DI-14.8.5). It was `win-sync-sys`'s until DI-14.8.3 moved it.
win-handles-sys = { version = "0.1.0", path = "../win-handles-sys" }
# The rule that wraps a Win32 code as an `HRESULT` and reads one back out (DI-9.7.11): this crate
# owns the numbering of the codes it reports, and that crate owns the rule.
win-error-codes = { version = "0.0.2", path = "../win-error-codes" }

# The debugger sink's call (DI-12.1.3): `OutputDebugStringW`, made safe. The crate forbids `unsafe`, so it cannot
# make the call itself.
win-debugging-sys = { version = "0.0.1", path = "../win-debugging-sys" }

# The default diagnostic sink (DI-12.1.6): the ETW provider for dioring's delay events, which an instance built with no sink
# of its own writes to. A crate of its own, so that this one needs no unsafe code to register a provider.
durable-ioring-events = { version = "0.0.1", path = "../durable-ioring-events" }

[dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
]

[features]
# The fault seam (DI-3.2.4): `Dioring::fail_next_flush`, failures on demand for tests. Off by
# default; nothing in production has a use for it. Built on the ring crate's own seam, which
# transforms a real completion rather than fabricating one, so it cannot cause undefined behaviour,
# only the wrong answer it was asked for.
fault-injection = ["windows-ioring-sys/fault-injection"]

[dev-dependencies]
# A trace session, for the test that shows the default sink's events reach ETW (DI-12.1.6). It needs privilege, so that test is
# ignored by default. A dev-dependency's features reach test builds only.
win-etw-sys = { path = "../win-etw-sys", features = ["test-util"] }
# A debugger that runs a program and keeps the strings it sends, which the debugger sink's tests observe it with
# (DI-12.1.3). The debugging crate's own `test-util` feature: this crate forbids `unsafe`, so the debugger is
# written there. A dev-dependency's features reach test builds only.
win-debugging-sys = { path = "../win-debugging-sys", features = ["test-util"] }
# This crate's own tests, and the worked examples in README.md -- compiled as doctests -- drive
# failures through the seam, so every test build enables it: a feature gate a plain `cargo test`
# skips would leave those examples unrun.
win-durable-ioring = { path = ".", features = ["fault-injection"] }
# The ring crate's kernel seam, for the tests that fail the instance's ring's submits (DI-7.1): a
# responder registered for the ring answers on every thread that submits to it, pool threads
# included (the ring crate's D-85), and `sys::submit_faults` is its safe form, so this crate's
# `forbid(unsafe_code)` stands (DI-D-4). A dev-dependency's features reach test builds only.
windows-ioring-sys = { path = "../windows-ioring-sys", features = ["kernel-seam"] }
# Aligned buffers, for the tests that write to an unbuffered file, whose buffers must start on a
# sector (DI-D-60).
io-buffers = { version = "0.1.0", path = "../io-buffers" }
# A directory listing's identities, which the open by identifier is tested with (DI-15.2): the record
# `FileIdExtdDirectoryInfo` fills, read by the crate that enumerates with it. Path-only, with no `version`: Cargo checks a pinned
# version against the path at every build, so a release of that crate would break this one, and a
# versionless dev-dependency is left out of the published manifest.
windows-file-enumeration-sys = { path = "../windows-file-enumeration-sys" }

# A blocking push, built on the public API as a helper to use or adapt (DI-7.4, DI-D-56). Its own
# tests run with the crate's: without `test = true` cargo builds an example and never runs them.
[[example]]
name = "blocking_push"
path = "examples/blocking_push/main.rs"
test = true

[package.metadata.docs.rs]
# The crate is Windows-only, so docs.rs must build on a Windows target or it would render an
# almost-empty crate.
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
