[package]
name = "windows-impersonation-token-sys"
version = "0.1.1" # x-release-please-version
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/windows-impersonation-token-sys"
description = "Memory-safe capture, transport, and scoped application of Windows impersonation tokens."
readme = "README.md"
keywords = ["windows", "impersonation", "token", "security", "ffi"]
categories = ["api-bindings", "os::windows-apis", "authentication"]

[lib]
path = "src/lib.rs"

# The crate is Windows-only, so docs.rs must build it on a Windows target or it
# would render an empty crate.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
# The captured token is shared by every clone through the workspace's one shared owner of a handle,
# rather than an `Arc<OwnedHandle>` of this crate's own (IT-inf.1).
win-shared-os-owned-handle = { version = "0.1.0", path = "../win-shared-os-owned-handle" }

[dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_Threading",
]
