[package]
name = "windows-guard-alloc"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A Windows guard-page global allocator for test builds: every allocation abuts a PAGE_NOACCESS guard page, and a freed address is decommitted and never reused, so an overrun or a use-after-free faults deterministically instead of reading stale bytes."

# Test instrumentation, not library surface. Publishing it would invite a
# consumer to depend on an allocator whose whole design trades memory for
# determinism -- it never reuses an address, so a long-running process grows
# without bound. That is correct for a test binary and wrong for anything else.
publish = false

[dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Memory",
	"Win32_System_SystemInformation",
] }
