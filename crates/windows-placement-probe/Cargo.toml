[package]
name = "windows-placement-probe"
version = "0.1.0"
# Publication to crates.io is an open decision -- see PT-5.3 in
# CHECKLIST-placement-tool.md. The distribution that matters is the CI-built
# binary attached to a GitHub release, because the download is the provenance:
# a binary built here is traceable to the commit that produced it in a way a
# local build of identical source is not. `false` until that decision is made,
# so the crate cannot be published by accident before it is meant to be.
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Measures what thread placement costs on a Windows machine -- SMT siblings, cache domains, efficiency classes and NUMA hops -- and produces one structured record to send back."

[lib]
path = "src/lib.rs"

# One binary, deliberately. A stranger doing a favour must not be asked to run
# three things and collate them; the internal probes in windows-platform-probes
# stay separate because a development loop wants the opposite.
[[bin]]
name = "placement-probe"
path = "src/bin/placement_probe.rs"

[features]
# The submission record is the product, so serialization is not optional the way
# it is in the layers below. The feature exists so the measurement code can be
# used without it, not so the record can.
default = ["serde"]
serde = ["dep:serde", "windows-topology-sys/serde"]

[dependencies]
windows-topology-sys = { version = "0.1.0", path = "../windows-topology-sys" }
windows-waitable-queues = { version = "0.1.0", path = "../windows-waitable-queues" }
serde = { version = "1.0", features = ["derive"], optional = true }
# The tool emits the record itself, so a serializer is not a test-only concern.
# It is also what derives the schema golden: the archived shape comes from
# serializing a record and walking the result, never from a hand-kept list.
serde_json = "1.0"

[dependencies.windows-sys]
version = "0.61.2"
default-features = false
features = [
    "Win32_Foundation",
    # Thread affinity: this crate pins both ends of a handoff to chosen
    # processors, and a run whose pinning silently failed would measure the
    # scheduler's preferences instead of the placement it claims to.
    "Win32_System_Threading",
    # The machine-description fields that travel with a submission, so a
    # result can be read months later without asking its sender anything.
    "Win32_System_SystemInformation",
    # Those fields are read from the registry rather than from the version and
    # CPUID APIs: `GetVersionEx` is shimmed and lies to an unmanifested process
    # about the major version, and CPUID's brand string does not exist on
    # ARM64. The registry is truthful on both counts and on both architectures.
    "Win32_System_Registry",
]
