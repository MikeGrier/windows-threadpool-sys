#
# The long-haul and probation test tiers. See DEVELOPMENT.md, "Test tiers", and
# DESIGN-NOTES.md, "long-haul-tier".
#
# A test whose scale is the point rather than the claim is `#[ignore = "long-haul: ..."]`
# in a module named `long_haul`, so ci.yml and every sabotage entry skip it and this
# workflow runs it. A test that has never run anywhere is the same with `probation`.
# libtest selects by name and not by ignore reason, which is why the module is part of
# the convention and why tools/check-test-tiers.ps1 holds the two in step.
#
# WHEN IT RUNS. Daily, and only when `main` has moved since the last run that
# completed: on an unchanged `main` a run would repeat the last one's result at the cost
# of a workspace build and every long test. tools/plan-long-haul.ps1 decides, and has
# tests of its own. A manual dispatch always runs, on the branch it is dispatched from.
#
# WHAT FAILS IT. The long-haul tier: a failure there fails the run, since those tests
# are the full-scale form of claims the push-time suites hold at a small size. The
# probation tier does not: its tests have no record yet, and a failure is data rather
# than a verdict. It runs after the long-haul tier, and whatever the long-haul tier did.
# Its results are kept across runs on the probation-results branch, by the last job, and
# reported in the run's summary (DESIGN-NOTES.md, "probation-results").
#
# WHY IT IS NOT PART OF THE SABOTAGE SWEEP. A sweep runs a crate's whole suite once per
# entry, so a tier that costs minutes would be paid for hundreds of times. A sweep never
# passes `--ignored` and so never pays for either tier.
name: long-haul

on:
  schedule:
    # Off the hour, when scheduled runs are least delayed.
    - cron: '47 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One at a time, never cancelling: a run cancelled by the next one would count as not
# completed, and the commit it was on would be run again.
concurrency:
  group: long-haul
  cancel-in-progress: false

jobs:
  # Asks whether `main` has moved. Needs `actions: read` to list the earlier runs.
  plan:
    name: plan
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide whether main has moved
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: ./tools/plan-long-haul.ps1 -EventName "${env:EVENT_NAME}" -Sha "${env:RUN_SHA}" -CurrentRunId "${env:RUN_ID}" -GitHubOutput "${env:GITHUB_OUTPUT}"

  tiers:
    name: long-haul and probation
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: windows-latest
    # The long tier's tests cost seconds each, not hours; a run past this has stalled.
    timeout-minutes: 120
    # See ci.yml: without this, rustup's directory-scoped toolchain file would win over
    # the toolchain just installed.
    env:
      RUSTUP_TOOLCHAIN: stable
      RUST_BACKTRACE: 1
      RUST_LIB_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: long-haul
      # tools/run-tier.ps1 owns the command that selects a tier: the library, binary,
      # integration and example test targets with `--ignored` and the tier's module
      # filter, and not the doctests, since a doctest cannot sit in a `long_haul`
      # module. `--no-fail-fast` so every crate's tier reports rather than the first
      # to fail. It writes what each test did, and exits with cargo's own code.
      - name: Run the long-haul tier
        shell: pwsh
        run: ./tools/run-tier.ps1 -Module long_haul -OutputDirectory .scratch/tiers/long_haul
      # After the long-haul tier, and whether or not it passed, but never cancelled.
      - name: Run the probation tier
        id: probation
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: ./tools/run-tier.ps1 -Module probation -OutputDirectory .scratch/tiers/probation
      # What each probation test did, for the job below that keeps it. Passed on as an
      # artifact so that the job holding write access never runs the tests, which run
      # here with read-only access.
      - name: Upload what each probation test did
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: probation-outcomes
          path: .scratch/tiers/probation/outcomes.json
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  # Keeps what each probation test did, across runs, on the `probation-results` branch,
  # and reports it (DESIGN-NOTES.md, "probation-results"). The only job here that writes
  # to the repository, and it writes one branch, which holds nothing but this record. It
  # runs the scripts of the checkout this run is for and none of the tests, which ran in
  # the job above with read-only access.
  #
  # Not fatal, as the sweep's equivalent is not: the record only ever gains or misses a
  # run, and a red run for a publish that failed would be read as a test that did.
  record:
    name: keep the probation results
    needs: [plan, tiers]
    if: ${{ always() && needs.plan.outputs.run == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download what each probation test did
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: probation-outcomes
          path: .scratch/probation
      # The id of the run and its attempt: a re-run of the jobs is another run of the
      # tests, and applying the same id twice is applying it once.
      - name: Publish the results to the probation-results branch
        if: ${{ hashFiles('.scratch/probation/outcomes.json') != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
        run: ./tools/publish-probation-results.ps1 -Outcomes .scratch/probation/outcomes.json -RunId "${env:RUN_ID}" -Commit "${env:RUN_SHA}"
      # Read back from the branch, so what is reported is what is kept, and so that a
      # run that could not publish still reports what the branch holds.
      - name: Report the probation tier
        continue-on-error: true
        shell: pwsh
        run: ./tools/report-probation.ps1 -SummaryPath "${env:GITHUB_STEP_SUMMARY}"
