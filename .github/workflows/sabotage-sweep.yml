#
# Sabotage sweeps, which CI deliberately does not gate on.
#
# A sweep rebuilds a crate and runs its whole suite once per manifest entry, so
# its cost scales with the crate's build and suite rather than with the change
# under review. Measured on this repository, per-entry cost spans more than an
# order of magnitude between crates: `windows-placement-probe` sweeps its whole
# manifest in about a minute, while `windows-threadpool-sys` measured about
# eighty seconds for a single entry -- nearly all of it rebuild rather than
# test, which is why the split below is built to keep the build cache warm. The
# large manifests are therefore tens of minutes. That is the wrong shape for a
# per-push gate and the right shape for something that runs once per
# integration.
#
# **This is not the `sabotage harness tests` job in ci.yml.** That job runs the
# harness's own unit tests with cargo stubbed out, finishes in well under two
# minutes, and stays on every push. This workflow is the thing it is often
# mistaken for: the real sweeps, against the real manifests.
#
# WHY POST-MERGE AND NIGHTLY. A sweep that fails needs to name the change that
# broke it. On `push: main` the run is attributable to one merge; on a schedule
# it is attributable to a day's worth. So each merge is swept, but only for the
# entries it could have affected: those of the crates it touched and of every
# crate that builds on one, or all of them when it touched an input every sweep
# shares. What that cannot see -- a change elsewhere in a crate making an entry's
# defect unreachable, a shared test helper weakening the tests that call it -- is
# what the nightly run is for: it sweeps every entry of every manifest, running
# each entry's whole suite, exactly as a sweep did before scoping, and it
# re-learns which tests catch each entry. The rule, and what it cannot see, are
# in DESIGN-NOTES.md, "sabotage-scope".
#
# WHY IT DOES NOT GATE ANYTHING. By the time this runs the merge has happened, so
# a failure is a report rather than a block. That is the deliberate trade: the
# alternative is adding tens of minutes to every pull request to re-check
# guarantees that change far more slowly than the code does.
name: sabotage sweeps

on:
  push:
    branches: [main]
    # No `paths:` filter. Which manifests a push could have affected is the
    # planner's question, answered from the push's diff and the crates' path
    # dependencies (`plan-sabotage-matrix.ps1 -Since`), and an empty answer
    # skips the sweep. A filter here was a second copy of the list of inputs
    # every sweep shares -- the lockfile, the toolchain, the sabotage tools and
    # `tools/common.ps1` -- and the earlier versions of it show how such a copy
    # goes: once it missed the matrix planner, once `common.ps1`. That list now
    # lives once, in `Test-SabotageSharedInput` in `tools/common.ps1`.
    #
    # A crate's documentation is such an input too: every crate here splices
    # its README into the library under `cfg(doctest)`, and a sweep runs the
    # crate's whole `cargo test`, doctests included, once per entry. A file
    # under `crates/<name>/` selects that crate whatever it is.
  # The backstop: every entry of every manifest, whole suites. At a time off the
  # hour, when scheduled runs are least delayed.
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'One manifest path, or blank for every manifest'
        required: false
        default: ''
      name:
        description: 'Wildcard over sabotage names, for re-running one entry'
        required: false
        default: '*'

permissions:
  contents: read

# Every run in a group of its own, so none cancels another. A post-merge run
# sweeps only what its merge could have affected, so a later merge cancelling it
# -- which is what one group per ref with `cancel-in-progress` did -- would leave
# the earlier merge's crates unswept until the nightly run. Runs from close merges
# therefore sweep side by side. Each saves its own record of which tests caught
# each entry, so the record the next run restores may lack what a concurrent run
# learned; that only makes a later scoped run larger, and the nightly run
# re-learns all of it.
#
# The nightly run, and a dispatch, likewise never cancel or wait for a post-merge
# run, nor it for them.
concurrency:
  group: sabotage-sweep-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # The matrix is DERIVED from the manifests, not listed here. A list stores two
  # facts the repository already owns -- which crates have a manifest, and how
  # many entries each has -- and both drift silently. Both already did: within
  # the branch that added this workflow, one manifest grew and left four stale
  # numbers behind, including a worked shard table describing no real split.
  #
  # This job also resolves the `manifest` dispatch input. Selecting jobs for a
  # named manifest used to be an `endsWith` test on each matrix entry, so a typo
  # matched NOTHING: every sweep step skipped, every job green, nothing swept --
  # a result indistinguishable from a clean run. The planner fails loudly on an
  # unknown name instead, once, before any sweep starts.
  plan:
    name: plan the shard matrix
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # The whole history, because a push is planned against its previous head,
      # and a shallow clone does not have it: the planner would then plan every
      # manifest, which is safe and is the cost this exists to avoid.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # For `cargo metadata`, which says which crates build on which. It reads
      # manifests and builds nothing.
      - uses: dtolnay/rust-toolchain@stable
      # The record of which tests caught each entry (DESIGN-NOTES.md,
      # "sabotage-scope"), as the latest run saved it. Restored by prefix, as
      # each run saves its own; the exact key never exists yet, and is named only
      # because the action requires one. This is the one restore in a run: the
      # plan and every shard must work from the same record, or a shard would
      # select different entries from the ones the plan counted for it and cut
      # its slice from a different list. So it is passed on below as an artifact,
      # not restored again. It may have been saved by a run of a later commit,
      # since runs overlap; an entry learned at a commit this checkout does not
      # contain is not used (tools/common.ps1, Get-SabotageCatcherTests).
      - name: Restore the record of which tests caught each entry
        uses: actions/cache/restore@v6
        with:
          path: .scratch/sabotage/catchers.json
          key: sabotage-catchers-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sabotage-catchers-
      # Rewritten even when nothing was restored, so the snapshot always exists:
      # a missing record merges as an empty one.
      - name: Snapshot the record for this run
        shell: pwsh
        run: ./tools/merge-sabotage-catchers.ps1 -Path .scratch/sabotage/catchers.json -Output .scratch/sabotage/catchers.json
      - name: Upload the snapshot
        uses: actions/upload-artifact@v7
        with:
          name: catchers-snapshot
          path: .scratch/sabotage/catchers.json
          if-no-files-found: error
          retention-days: 1
      # The dispatch input reaches PowerShell through the ENVIRONMENT, never by
      # `${{ }}` interpolation into the script body. An expression substituted
      # into `run:` is spliced in as source before PowerShell parses it, so a
      # value carrying a quote and a statement separator runs as a command on
      # the runner. Read back as `${env:...}` it can only ever be data.
      #
      # A push is planned against its previous head. The nightly run and a
      # dispatch have none, and plan every entry their inputs allow: the nightly
      # run is the full sweep, the backstop for what scoping cannot see.
      - id: plan
        shell: pwsh
        env:
          SWEEP_MANIFEST: ${{ inputs.manifest }}
          SWEEP_SINCE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: ./tools/plan-sabotage-matrix.ps1 -Manifest "${env:SWEEP_MANIFEST}" -Since "${env:SWEEP_SINCE}" -CatcherRecord .scratch/sabotage/catchers.json -GitHubOutput "${env:GITHUB_OUTPUT}"

  sweep:
    name: sweep ${{ matrix.label }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: plan
    # A plan with no jobs is a push that could not have affected any manifest.
    # A matrix built from an empty list is an error, not a skip, so it is not
    # built at all.
    if: needs.plan.outputs.jobs != '0'
    runs-on: windows-latest
    # Sharded by crate AND within each crate, so the wall clock is the longest
    # *shard* rather than the longest manifest. Sharding by crate alone leaves
    # one worker sweeping a whole large manifest while the rest sit idle.
    #
    # Shard counts come from each manifest's entry count (see the planner), which
    # is possible because the harness's split is even at any shard count: it
    # orders entries by file and cuts that order into equal contiguous blocks, so
    # shard sizes differ by at most one AND each shard still runs long same-file
    # runs. `tools/test-run-sabotage.ps1` asserts both properties.
    #
    # The same-file runs are INTENDED to keep the build cache warm, and that is
    # an argument from how cargo rebuilds rather than a measured result -- the
    # one comparison taken so far ran against it and was confounded. See the
    # -ShardCount help in `tools/run-sabotage.ps1`. The evenness half is not in
    # doubt; the cache half is why this split is no worse than the alternatives,
    # not a claim that it is faster.
    #
    # There is no manifest-shaped floor to respect -- an earlier revision of the
    # harness refused to split a file, so a manifest whose entries cluster in
    # one source file could not go below that cluster's size on a single worker
    # whatever the shard count. An over-provisioned shard is not an error: the
    # harness treats an empty shard as a success and exits before the baseline,
    # so it costs nothing but a checkout.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Generous against the measured cost, because the failure this bound is for
    # is a sweep that hangs rather than one that is merely large. The harness
    # applies its own per-entry bound inside this one.
    timeout-minutes: 60
    steps:
      # The whole history, as in `plan`: the shard measures the same change from the
      # same base, so it finds the entries the plan counted. A shallow clone would
      # not have the base, and the shard would sweep every entry.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The repository's pinned toolchain, not the floating stable the lint jobs
      # force: a sweep is asking whether *this* crate's suite notices a defect,
      # so it must build the crate the way the crate is specified to build.
      # `@stable` installs a toolchain; `rust-toolchain.toml` then decides which
      # one cargo actually runs, because rustup resolves that directory override
      # ahead of the installed default. The version is therefore DERIVED here
      # rather than copied -- an earlier revision pinned `@1.98.0` inline, which
      # is a second home for a fact the workspace already owns, and the comment
      # beside it claimed to use "the repository's pinned toolchain" while in
      # fact restating it. This is the pattern every other workflow here uses.
      #
      # Deliberately NOT setting `RUSTUP_TOOLCHAIN`: the lint jobs set it to
      # `stable` and that is exactly what overrides the directory pin. A sweep
      # asks whether *this* crate's suite notices a defect, so it must build the
      # crate the way the crate is specified to build.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # `run-sabotage.ps1` forces every cargo invocation into
          # `.scratch/sabotage/target` with an absolute `--target-dir`, so the
          # action has to be TOLD that. Its default of `. -> target` caches a
          # directory the sweep never writes: every shard would start from a
          # cold build while the per-shard key below made it look cached, which
          # is the failure that hides rather than fails.
          workspaces: '. -> .scratch/sabotage/target'
          # Every shard is a separate job building a different slice, so they
          # must not share a key.
          key: sabotage-${{ matrix.label }}-${{ matrix.shard }}
      # The record the plan counted entries from: the plan's snapshot, not a
      # restore of its own, which could find a record another run saved since.
      - name: Download the record the plan used
        uses: actions/download-artifact@v8
        with:
          name: catchers-snapshot
          path: .scratch/sabotage
      # Unconditional. A dispatch that named one manifest has already been
      # resolved by `plan`, which emitted jobs for that manifest alone, so there
      # is nothing left for a step-level `if` to decide. The pair of conditional
      # steps this replaces could BOTH evaluate false -- on any manifest name
      # the `endsWith` test did not match -- and a job whose every step is
      # skipped is a job that succeeds, so the run went green having swept
      # nothing.
      - name: Sweep ${{ matrix.label }}
        shell: pwsh
        # Below the job's own bound, so a sweep that stalls fails THIS step and
        # the transcript upload below still runs. Hitting the job's bound instead
        # cancels the job, `failure()` is false on a cancellation, and the run
        # that most needed its evidence uploaded none -- which is how a sweep
        # once sat for the full hour on one entry and left nothing to read.
        timeout-minutes: 50
        env:
          # Same rule as the planner step above. `inputs.name` is the value an
          # attacker chooses, and the matrix values travel the same way rather
          # than asking a reader to work out which of them is safe to splice.
          SWEEP_MANIFEST: ${{ matrix.manifest }}
          SWEEP_SHARD: ${{ matrix.shard }}
          SWEEP_SHARDS: ${{ matrix.shards }}
          SWEEP_NAME: ${{ inputs.name || '*' }}
          # The plan's base, so this shard sweeps the entries the plan counted for it.
          SWEEP_SINCE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: ./tools/run-sabotage.ps1 -Manifest "${env:SWEEP_MANIFEST}" -Shard ${env:SWEEP_SHARD} -ShardCount ${env:SWEEP_SHARDS} -Name "${env:SWEEP_NAME}" -Since "${env:SWEEP_SINCE}" -TraceLaunches
      # The transcripts are the whole diagnostic value of a failed sweep: they
      # name which entry survived and carry the suite output that let it.
      - name: Upload transcripts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sabotage-${{ matrix.label }}-${{ matrix.shard }}
          # The working copy and its target directory live here too and are far
          # too large to upload; only the transcripts are wanted. They are
          # `<name>.txt` plus `.build`, `.err` and `.build.err` siblings, so the
          # glob has to be `*.txt*` -- `*.log` matches none of them, which is how
          # an artifact step silently uploads nothing.
          path: .scratch/sabotage/*.txt*
          if-no-files-found: ignore
          retention-days: 14
      # This shard's record, for the `record` job to merge. Whatever the sweep's
      # verdict: an entry that did not behave as declared was still run, and
      # what caught it, or did not, is still what the next run needs.
      - name: Upload the record of which tests caught each entry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catchers-${{ matrix.label }}-${{ matrix.shard }}
          path: .scratch/sabotage/catchers.json
          if-no-files-found: ignore
          retention-days: 1

  # One record for the next run: what this run's shards learned, over the
  # snapshot the run started from. Each shard wrote only the entries it ran on
  # top of that snapshot, and the merge keeps every entry's latest result, so
  # neither a shard's slice nor an entry this run did not reach is lost.
  record:
    name: keep the record of which tests caught each entry
    needs: [plan, sweep]
    if: always() && needs.plan.outputs.jobs != '0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The snapshot, `catchers-snapshot`, and every shard's record,
      # `catchers-<label>-<shard>`, each into a directory of its own.
      - name: Download the snapshot and the shards' records
        uses: actions/download-artifact@v8
        with:
          pattern: catchers-*
          path: .scratch/catchers-shards
      - name: Merge them
        shell: pwsh
        run: ./tools/merge-sabotage-catchers.ps1 -Path .scratch/catchers-shards -Output .scratch/sabotage/catchers.json
      - name: Save the record for the next run
        uses: actions/cache/save@v6
        with:
          path: .scratch/sabotage/catchers.json
          key: sabotage-catchers-${{ github.run_id }}-${{ github.run_attempt }}
