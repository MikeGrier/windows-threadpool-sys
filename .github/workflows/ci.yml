name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Most crates are Windows-only (every item is behind `cfg(windows)`), so their
# build, test, and lint run exclusively on Windows. Both the `--all-features`
# union and the minimal default (no-feature) configuration are exercised: the
# default set is a supported, published configuration, and a feature-union-only
# build can hide a missing `cfg` or an item that depends on an opt-in feature.
# `wtf-string` is portable, so it is additionally built, tested, and linted on
# Linux and macOS (the `portable` job) to keep its non-Windows support verified.
jobs:
  encoding:
    name: encoding sanity check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run check-encoding.ps1
        shell: pwsh
        run: ./tools/check-encoding.ps1

  build-test:
    name: build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (all features)
        run: cargo build --workspace --all-targets --all-features --locked
      - name: cargo build (default features)
        run: cargo build --workspace --all-targets --locked
      - name: cargo test (all features)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: cargo test (default features)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test --workspace --locked --no-fail-fast

  fmt:
    name: rustfmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: rustdoc (intra-doc links)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: MSRV check 1.98
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets --all-features --locked

  portable:
    name: wtf-string (non-Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (wtf-string)
        run: cargo build -p wtf-string --all-targets --locked
      - name: cargo test (wtf-string)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test -p wtf-string --locked --no-fail-fast
      - name: cargo clippy (wtf-string)
        run: cargo clippy -p wtf-string --all-targets --locked -- -D warnings
