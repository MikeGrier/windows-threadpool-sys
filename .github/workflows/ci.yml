name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Most crates are Windows-only (every item is behind `cfg(windows)`), so their
# build, test, and lint run exclusively on Windows. Both the `--all-features`
# union and the minimal default (no-feature) configuration are exercised: the
# default set is a supported, published configuration, and a feature-union-only
# build can hide a missing `cfg` or an item that depends on an opt-in feature.
# `wtf-string` is portable, so it is additionally built, tested, and linted on
# Linux and macOS (the `portable` job) to keep its non-Windows support verified.
jobs:
  encoding:
    name: encoding sanity check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run check-encoding.ps1
        shell: pwsh
        run: ./tools/check-encoding.ps1

  # The edition, MSRV, and pinned channel are declared once in Cargo.toml and
  # rust-toolchain.toml, then restated a dozen times -- in this file's `msrv`
  # job below, in README/DEVELOPMENT prose, and in the instruction files a code
  # reviewer reads. The restatements cannot be deleted (a reviewer cannot follow
  # a link out of a diff to resolve `edition.workspace = true`), so this job
  # keeps them honest instead. Needs no toolchain: it only reads files.
  baseline:
    name: language baseline consistency
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run check-baseline.ps1
        shell: pwsh
        run: ./tools/check-baseline.ps1

  # windows-ioring-sys has shipped three defects of one shape: a public method
  # whose return type permitted an operation nobody intended (D-35, D-36, D-43).
  # All three arrived through ordinary, well-reviewed changes -- what was missing
  # was a specific question asked at a specific moment, and "remember to ask it"
  # is not a mechanism. This job fails when that crate's borrow-returning surface
  # changes, so the question in its DESIGN-INSTRUCTIONS.md cannot be skipped.
  # Checks shape, not correctness: it asks for a sentence, it does not judge the
  # design. Needs no toolchain -- it only reads files.
  borrow-surface:
    name: ioring borrow-surface inventory
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run check-borrow-surface.ps1
        shell: pwsh
        run: ./tools/check-borrow-surface.ps1

  build-test:
    name: build + test
    runs-on: windows-latest
    # The repo's rust-toolchain.toml pins the MSRV for local dev; without this
    # override rustup's directory-scoped toolchain file would win over whatever
    # dtolnay/rust-toolchain@stable just installed, silently running the MSRV
    # here too and defeating this job's forward-compatibility coverage.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (all features)
        run: cargo build --workspace --all-targets --all-features --locked
      - name: cargo build (default features)
        run: cargo build --workspace --all-targets --locked
      - name: cargo test (all features)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test --workspace --all-features --locked --no-fail-fast
      - name: cargo test (default features)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test --workspace --locked --no-fail-fast
      # windows-file-watcher-example-test-harness is a normal workspace member
      # that depends on windows-file-watcher with the test-util feature, so
      # the two `--workspace` steps above unify that feature onto
      # windows-file-watcher and no longer actually verify its published
      # *default*-feature build/test. Select it alone (no --workspace) to
      # isolate from that unification and close the gap.
      - name: cargo build (windows-file-watcher, default features)
        run: cargo build -p windows-file-watcher --all-targets --locked
      - name: cargo test (windows-file-watcher, default features)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test -p windows-file-watcher --locked --no-fail-fast

  platform-probes:
    # The asserted probe tier already runs on x64 here, because
    # windows-platform-probes is a workspace member and `cargo test --workspace`
    # picks it up. This job adds the two tiers that job does NOT reach: the
    # `#[ignore]`d tests, and the binaries that print the magnitudes.
    #
    # Every measurement in this workspace was originally taken on ARM64, so
    # running them on this x64 runner is what answers "which findings are
    # architecture-dependent" (CHECKLIST-thread-ambient.md, M27.5).
    #
    # A FAILURE HERE IS A RESULT, NOT A BUILD BREAK TO PATCH AWAY. The ignored
    # tests assert the *shape* of a measured platform fact, so a failure means
    # the fact differs on this architecture and the design note resting on it
    # needs revisiting. Read the output before changing an assertion.
    name: platform probes (x64, ignored tier + magnitudes)
    runs-on: windows-latest
    # Bounded so a probe that wedges reports rather than burning the job's
    # default six-hour ceiling. The suite takes seconds when healthy.
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (probes, including the ignored tier)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test -p windows-platform-probes --locked --no-fail-fast -- --include-ignored
      # The binaries print the numbers the tests deliberately do not assert:
      # host-specific magnitudes, which are exactly what an architecture
      # comparison needs and what a pass/fail cannot carry.
      #
      # probe-cancel-io is DELIBERATELY ABSENT and must stay that way. It is
      # binary-only because CancelSynchronousIo can block indefinitely -- that
      # is the finding -- so running it here would hang the job by design.
      #
      # One step per probe, deliberately, rather than one `run: |` block listing
      # them. These steps take the Windows runner's default shell, `pwsh`, where
      # a failing *native* command neither aborts the script nor sets the step's
      # exit code: Actions ends a pwsh step with `exit $LASTEXITCODE`, so only
      # the last command in a block is reported. Grouped, a failing
      # probe-error-mode followed by a passing probe-worker-context exits 0 and
      # the job goes green. Measured on pwsh 7.6.5 rather than assumed:
      # `$ErrorActionPreference = 'stop'` does not change it, because that
      # governs cmdlet errors and not native exit codes.
      #
      # Splitting also names the failing probe in the Actions UI, which matters
      # for a job whose output is per-probe magnitudes.
      - name: probe magnitudes (error mode)
        run: cargo run -p windows-platform-probes --bin probe-error-mode --locked
      - name: probe magnitudes (handle state)
        run: cargo run -p windows-platform-probes --bin probe-handle-state --locked
      - name: probe magnitudes (worker context)
        run: cargo run -p windows-platform-probes --bin probe-worker-context --locked
      - name: probe magnitudes (pool growth)
        run: cargo run -p windows-platform-probes --bin probe-pool-growth --locked
      - name: probe magnitudes (device map)
        run: cargo run -p windows-platform-probes --bin probe-device-map --locked
      - name: probe magnitudes (IoRing)
        run: cargo run -p windows-platform-probes --bin probe-ioring --locked
      - name: probe magnitudes (completion port)
        run: cargo run -p windows-platform-probes --bin probe-completion-port --locked

  feature-matrix:
    name: windows-overlapped-io-sys (${{ matrix.feature }} only)
    runs-on: windows-latest
    # `--all-features` and default (empty) are both covered by build-test above,
    # but neither exercises a single operation family in isolation. That gap let
    # a family-specific cfg gate on a *core* item (M13.1: the notification-mode
    # setter was gated on `fs` alone, so a `device`-only consumer could not
    # reach it even though `device.rs` already depended on it) go unbuilt by CI
    # until it was reported by hand. This job builds, lints, and tests each
    # family alone -- and the bare core with no family at all -- so the next
    # family addition gets the same guarantee without anyone remembering to ask
    # for it.
    strategy:
      fail-fast: false
      matrix:
        feature: ["", fs, socket, device]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check -p windows-overlapped-io-sys --all-targets --no-default-features --features "${{ matrix.feature }}" --locked
      - name: cargo clippy
        run: cargo clippy -p windows-overlapped-io-sys --all-targets --no-default-features --features "${{ matrix.feature }}" --locked -- -D warnings
      - name: cargo test
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test -p windows-overlapped-io-sys --no-default-features --features "${{ matrix.feature }}" --locked --no-fail-fast

  ioring-no-threadpool:
    name: windows-ioring-sys (no threadpool feature)
    runs-on: windows-latest
    # `EventDelivery` sits behind the default-on `threadpool` feature (D-22),
    # which makes `default-features = false` a published configuration that
    # nothing above builds: every `--workspace` step uses the default set, and
    # `--all-features` turns the gate back on. Without this job that path rots
    # silently -- a missing `cfg` on an item, a test, or an example is invisible
    # until a Model B consumer hits it. This is the cost the feature gate was
    # accepted with, so it is paid here rather than assumed.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build -p windows-ioring-sys --all-targets --no-default-features --locked
      - name: cargo clippy
        run: cargo clippy -p windows-ioring-sys --all-targets --no-default-features --locked -- -D warnings
      - name: cargo test
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test -p windows-ioring-sys --no-default-features --locked --no-fail-fast
      # The `docs` job only documents `--all-features`, so an intra-doc link
      # from ungated prose to a gated item resolves there and dangles here.
      # Measured, not hypothetical: the crate docs linked `[EventDelivery]`
      # from the ungated "Choosing a delivery architecture" section, and this
      # step is what fails on it.
      - name: cargo doc (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc -p windows-ioring-sys --no-deps --no-default-features --locked
      # The converse, so the gate is not vacuous in the other direction either:
      # selecting the crate alone with its default features isolates it from any
      # `--workspace` feature unification, the same reason windows-file-watcher
      # gets its own isolated steps above.
      - name: cargo clippy (default features, isolated)
        run: cargo clippy -p windows-ioring-sys --all-targets --locked -- -D warnings
      - name: cargo test (default features, isolated)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test -p windows-ioring-sys --locked --no-fail-fast

  fmt:
    name: rustfmt
    runs-on: windows-latest
    # See build-test's comment: forces the floating stable toolchain over the
    # repo's rust-toolchain.toml pin.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: windows-latest
    # See build-test's comment: forces the floating stable toolchain over the
    # repo's rust-toolchain.toml pin.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # See build-test's matching isolated steps: --workspace unifies
      # windows-file-watcher-example-test-harness's test-util dependency onto
      # windows-file-watcher, so the default-feature lint above never actually
      # checks it in isolation either.
      - name: cargo clippy (windows-file-watcher, default features)
        run: cargo clippy -p windows-file-watcher --all-targets --locked -- -D warnings

  docs:
    name: rustdoc (intra-doc links)
    runs-on: windows-latest
    # See build-test's comment: forces the floating stable toolchain over the
    # repo's rust-toolchain.toml pin.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (deny broken intra-doc links)
        env:
          # invalid_rust_codeblocks is denied because it is the lint that catches a
          # doc-comment code fence which never closes -- typically a sentence welded
          # onto the closing ``` by a mis-joined edit, which swallows the prose after
          # it into the example and corrupts the rendered page. Three of those reached
          # review in windows-namespace-request-sys while this job passed, because it
          # denied only the link lints and rustdoc reports this one as a warning.
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::invalid_rust_codeblocks"
        run: cargo doc --workspace --no-deps --all-features --locked

  msrv:
    name: MSRV check 1.98
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets --all-features --locked

  alloc-only:
    name: wtf-string (alloc-only, no_std)
    runs-on: windows-latest
    # See build-test's comment: forces the floating stable toolchain over the
    # repo's rust-toolchain.toml pin.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      # A bare-metal target ships no `std` at all, so this is what actually
      # proves the portable core is `no_std`: `--no-default-features` on a host
      # target would still link fine if a `std` dependency crept back in. The
      # converse is verified too -- building this target *with* the `std` feature
      # fails at `extern crate std`, so the gate is not vacuous.
      - name: cargo build (bare-metal no_std target)
        run: cargo build -p wtf-string --no-default-features --target thumbv7em-none-eabi --locked
      - name: cargo clippy (bare-metal no_std target)
        run: cargo clippy -p wtf-string --no-default-features --target thumbv7em-none-eabi --locked -- -D warnings
      # The tests are std-only (they use `HashMap`, `DefaultHasher`, ...), so the
      # alloc-only configuration is exercised on the host, where a test harness
      # exists. This covers the portable core's behaviour; the target build above
      # covers its `no_std`-ness.
      - name: cargo test (alloc-only, host)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test -p wtf-string --no-default-features --locked --no-fail-fast

  portable:
    name: wtf-string (non-Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # See build-test's comment in the Windows jobs above: forces the floating
    # stable toolchain over the repo's rust-toolchain.toml pin.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (wtf-string)
        run: cargo build -p wtf-string --all-targets --locked
      - name: cargo test (wtf-string)
        env:
          RUST_BACKTRACE: 1
          RUST_LIB_BACKTRACE: 1
        run: cargo test -p wtf-string --locked --no-fail-fast
      - name: cargo clippy (wtf-string)
        run: cargo clippy -p wtf-string --all-targets --locked -- -D warnings
