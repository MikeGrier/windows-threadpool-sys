name: publish-crate

on:
  push:
    tags:
      - 'windows-file-watcher-v*'
      - 'windows-overlapped-io-sys-v*'
      - 'windows-threadpool-sys-v*'
      - 'wtf-string-v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: cargo publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          crate="${tag%-v*}"
          version="${tag##*-v}"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          actual="$(printf '%s' "$metadata" | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version')"
          if [ -z "$actual" ] || [ "$actual" = "null" ]; then
            echo "::error::tag ${tag} references unknown crate ${crate}" >&2
            exit 1
          fi
          if [ "$actual" != "$version" ]; then
            echo "::error::tag ${tag} version ${version} does not match crate version ${actual}" >&2
            exit 1
          fi
          echo "CRATE_NAME=${crate}" >> "$GITHUB_ENV"
      # Some crates depend on sibling workspace crates by version as well as by
      # path, so `cargo publish`'s build verification resolves those dependencies
      # from crates.io, not the workspace checkout. Release-please opens separate
      # pull requests per crate (`separate-pull-requests: true` in
      # release-please-config.json), so sibling tags can land in any order; this
      # step blocks a dependent crate's publish until *every* workspace-sibling
      # dependency it declares is live on crates.io at the required version,
      # making the effective publish order independent of tag-push timing. It is a
      # no-op (the `deps` list is empty) for a crate with no workspace-sibling
      # dependencies.
      - name: Wait for workspace-sibling dependencies on crates.io
        shell: bash
        run: |
          workspace_crates="windows-file-watcher windows-overlapped-io-sys windows-threadpool-sys wtf-string"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          deps="$(printf '%s' "$metadata" | jq -r --arg n "$CRATE_NAME" \
            '.packages[] | select(.name == $n) | .dependencies[] | "\(.name) \(.req)"')"
          while IFS=' ' read -r dep_name dep_req; do
            [ -z "$dep_name" ] && continue
            case " $workspace_crates " in
              *" $dep_name "*) ;;
              *) continue ;;
            esac
            dep_version="$(printf '%s' "$dep_req" | sed -E 's/^\^//')"
            echo "waiting for ${dep_name} ${dep_version} on crates.io"
            ok=0
            max_attempts=60
            for attempt in $(seq 1 "$max_attempts"); do
              # --connect-timeout/--max-time bound a stalled connection so a hung
              # request can never prevent the loop from reaching max_attempts.
              # On failure curl exits non-zero; its -w output is unreliable then
              # (it emits "000" for a connect failure but may emit nothing for
              # others), so the status is set explicitly in the failure branch
              # rather than appended to whatever curl printed.
              if ! status="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "https://crates.io/api/v1/crates/${dep_name}/${dep_version}")"; then
                status=000
              fi
              if [ "$status" = "200" ]; then
                echo "${dep_name} ${dep_version} is available"
                ok=1
                break
              fi
              echo "attempt ${attempt}/${max_attempts}: not yet available (HTTP ${status}), retrying in 20s"
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "::error::timed out waiting for ${dep_name} ${dep_version} to publish; re-run this workflow once it is available" >&2
              exit 1
            fi
          done <<< "$deps"
      - name: cargo publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "$CRATE_NAME" --locked
