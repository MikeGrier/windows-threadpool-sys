name: publish-crate

on:
  push:
    tags:
      - 'windows-overlapped-io-sys-v*'
      - 'windows-threadpool-sys-v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: cargo publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          crate="${tag%-v*}"
          version="${tag##*-v}"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          actual="$(printf '%s' "$metadata" | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version')"
          if [ -z "$actual" ] || [ "$actual" = "null" ]; then
            echo "::error::tag ${tag} references unknown crate ${crate}" >&2
            exit 1
          fi
          if [ "$actual" != "$version" ]; then
            echo "::error::tag ${tag} version ${version} does not match crate version ${actual}" >&2
            exit 1
          fi
          echo "CRATE_NAME=${crate}" >> "$GITHUB_ENV"
      - name: cargo publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "$CRATE_NAME" --locked
