name: publish-crate

on:
  push:
    tags:
      - 'windows-overlapped-io-sys-v*'
      - 'windows-threadpool-sys-v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: cargo publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          crate="${tag%-v*}"
          version="${tag##*-v}"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          actual="$(printf '%s' "$metadata" | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version')"
          if [ -z "$actual" ] || [ "$actual" = "null" ]; then
            echo "::error::tag ${tag} references unknown crate ${crate}" >&2
            exit 1
          fi
          if [ "$actual" != "$version" ]; then
            echo "::error::tag ${tag} version ${version} does not match crate version ${actual}" >&2
            exit 1
          fi
          echo "CRATE_NAME=${crate}" >> "$GITHUB_ENV"
      # windows-threadpool-sys depends on windows-overlapped-io-sys by version as well
      # as by path, so `cargo publish`'s build verification resolves that dependency
      # from crates.io, not the workspace checkout. If both crates are released
      # together, their tags can land in either order, so this step blocks the
      # threadpool-sys publish until its required overlapped-io-sys version is live on
      # crates.io, making the effective publish order independent of tag-push timing.
      - name: Wait for windows-overlapped-io-sys dependency on crates.io
        if: env.CRATE_NAME == 'windows-threadpool-sys'
        shell: bash
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          dep_version="$(printf '%s' "$metadata" | jq -r '.packages[] | select(.name == "windows-threadpool-sys") | .dependencies[] | select(.name == "windows-overlapped-io-sys") | .req' | sed -E 's/^\^//')"
          if [ -z "$dep_version" ] || [ "$dep_version" = "null" ]; then
            echo "::error::could not determine required windows-overlapped-io-sys version" >&2
            exit 1
          fi
          echo "waiting for windows-overlapped-io-sys ${dep_version} on crates.io"
          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/windows-overlapped-io-sys/${dep_version}")"
            if [ "$status" = "200" ]; then
              echo "windows-overlapped-io-sys ${dep_version} is available"
              exit 0
            fi
            echo "attempt ${attempt}/${max_attempts}: not yet available (HTTP ${status}), retrying in 20s"
            sleep 20
          done
          echo "::error::timed out waiting for windows-overlapped-io-sys ${dep_version} to publish; re-run this workflow once it is available" >&2
          exit 1
      - name: cargo publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "$CRATE_NAME" --locked
