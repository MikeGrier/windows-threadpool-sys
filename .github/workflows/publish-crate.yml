name: publish-crate

on:
  push:
    tags:
      - 'windows-file-watcher-v*'
      - 'windows-impersonation-token-sys-v*'
      - 'windows-ioring-sys-v*'
      - 'windows-overlapped-io-sys-v*'
      - 'windows-threadpool-sys-v*'
      - 'windows-topology-sys-v*'
      - 'wtf-string-v*'
  # Manual escape hatch for a tag whose commit cannot publish. `cargo publish
  # --locked` refuses when Cargo.lock disagrees with the manifests, and the
  # pre-`cargo-workspace` release-please configuration left exactly that state
  # at several release commits, so those tags can never publish no matter how
  # often they are re-run. Dispatching publishes the crate at whatever version
  # the *current* branch declares.
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish from the selected branch
        required: true
        type: choice
        options:
          - windows-file-watcher
          - windows-impersonation-token-sys
          - windows-ioring-sys
          - windows-overlapped-io-sys
          - windows-threadpool-sys
          - windows-topology-sys
          - wtf-string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: cargo publish
    runs-on: windows-latest
    # Publish under the floating stable toolchain this job installs, not the
    # repo's rust-toolchain.toml MSRV pin. rustup resolves a directory override
    # ahead of `rustup default`, so without this every `cargo` call below --
    # `cargo metadata` for the tag/dependency checks and the `cargo publish`
    # verification build -- would silently run the pinned MSRV instead, making
    # the `@stable` setup step below misleading. The MSRV floor is guarded by
    # ci.yml's dedicated `msrv` job, not here.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve the crate to publish
        shell: bash
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # No tag to cross-check against; the branch's own manifest decides
            # the version, and `cargo publish` rejects one already on crates.io.
            crate="${{ inputs.crate }}"
            actual="$(printf '%s' "$metadata" | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version' | tr -d '\r')"
            if [ -z "$actual" ] || [ "$actual" = "null" ]; then
              echo "::error::unknown crate ${crate}" >&2
              exit 1
            fi
            echo "publishing ${crate} ${actual} from ${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_REF_NAME}"
            crate="${tag%-v*}"
            version="${tag##*-v}"
            # See the `tr -d '\r'` note in the sibling-wait step below: a
            # trailing CR here would make this equality check fail against an
            # otherwise-correct tag.
            actual="$(printf '%s' "$metadata" | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version' | tr -d '\r')"
            if [ -z "$actual" ] || [ "$actual" = "null" ]; then
              echo "::error::tag ${tag} references unknown crate ${crate}" >&2
              exit 1
            fi
            if [ "$actual" != "$version" ]; then
              echo "::error::tag ${tag} version ${version} does not match crate version ${actual}" >&2
              exit 1
            fi
          fi
          echo "CRATE_NAME=${crate}" >> "$GITHUB_ENV"
          echo "CRATE_VERSION=${actual}" >> "$GITHUB_ENV"
      # Some crates depend on sibling workspace crates by version as well as by
      # path, so `cargo publish`'s build verification resolves those dependencies
      # from crates.io, not the workspace checkout. One release PR bumps every
      # crate at once, so merging it pushes all sibling tags together and they
      # can be processed in any order; this step blocks a dependent crate's
      # publish until *every* workspace-sibling dependency it declares is live on
      # crates.io at the required version, making the effective publish order
      # independent of tag-push timing. It is a no-op (the `deps` list is empty)
      # for a crate with no workspace-sibling dependencies.
      - name: Wait for workspace-sibling dependencies on crates.io
        shell: bash
        run: |
          workspace_crates="windows-file-watcher windows-impersonation-token-sys windows-ioring-sys windows-overlapped-io-sys windows-threadpool-sys windows-topology-sys wtf-string"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          # `tr -d '\r'` is load-bearing on the Windows runner: jq.exe writes
          # CRLF, and `read` splits on LF alone, so without this the last field
          # on each line (`dep_req`) keeps a trailing CR. The version then
          # compares as "0.1.1\r", never matches any `.vers` in the index, and
          # the loop below burns all 60 attempts on a crate that published
          # fine. Only crates with workspace siblings enter that loop, so this
          # failed silently for every dependency-free crate.
          deps="$(printf '%s' "$metadata" | jq -r --arg n "$CRATE_NAME" \
            '.packages[] | select(.name == $n) | .dependencies[] | "\(.name) \(.req)"' | tr -d '\r')"
          while IFS=' ' read -r dep_name dep_req; do
            [ -z "$dep_name" ] && continue
            case " $workspace_crates " in
              *" $dep_name "*) ;;
              *) continue ;;
            esac
            dep_version="$(printf '%s' "$dep_req" | sed -E 's/^\^//')"
            # Probe the *sparse index*, not the REST API: a version can appear in
            # api/v1 before the index has propagated, and `cargo publish --locked`
            # resolves dependencies through the index -- so an API-only check can
            # pass and the publish still fail to resolve. Index paths are
            # `1/`, `2/`, `3/<c1>/`, or `<c1c2>/<c3c4>/` by name length.
            name_len=${#dep_name}
            if [ "$name_len" -le 2 ]; then
              prefix="$name_len"
            elif [ "$name_len" -eq 3 ]; then
              prefix="3/$(printf '%s' "$dep_name" | cut -c1)"
            else
              prefix="$(printf '%s' "$dep_name" | cut -c1-2)/$(printf '%s' "$dep_name" | cut -c3-4)"
            fi
            index_url="https://index.crates.io/${prefix}/${dep_name}"
            echo "waiting for ${dep_name} ${dep_version} in the crates.io index (${index_url})"
            ok=0
            max_attempts=60
            for attempt in $(seq 1 "$max_attempts"); do
              # --connect-timeout/--max-time bound a stalled connection so a hung
              # request can never prevent the loop from reaching max_attempts.
              # --fail makes an HTTP error (e.g. 404 before the crate exists in
              # the index) a non-zero curl exit, so jq only ever parses a real
              # body. The index returns newline-delimited JSON, one object per
              # version; `jq -e` exits non-zero when no line matches.
              if body="$(curl -s --fail --connect-timeout 10 --max-time 20 "$index_url")" \
                && printf '%s' "$body" | jq -e --arg v "$dep_version" \
                     'select(.vers == $v)' >/dev/null 2>&1; then
                echo "${dep_name} ${dep_version} is in the index"
                ok=1
                break
              fi
              echo "attempt ${attempt}/${max_attempts}: not yet in the index, retrying in 20s"
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "::error::timed out waiting for ${dep_name} ${dep_version} to publish; re-run this workflow once it is available" >&2
              exit 1
            fi
          done <<< "$deps"
      # Publishing is idempotent: a version already on crates.io is a success,
      # not a failure. `cargo publish` errors out on a duplicate, which would
      # make re-running a partly-failed release, or tagging a version that was
      # published by hand, look broken when nothing is wrong. Same sparse-index
      # probe as the sibling wait above, for the same reason: the index is what
      # `--locked` resolution actually reads.
      - name: Skip if this version is already published
        shell: bash
        run: |
          name_len=${#CRATE_NAME}
          if [ "$name_len" -le 2 ]; then
            prefix="$name_len"
          elif [ "$name_len" -eq 3 ]; then
            prefix="3/$(printf '%s' "$CRATE_NAME" | cut -c1)"
          else
            prefix="$(printf '%s' "$CRATE_NAME" | cut -c1-2)/$(printf '%s' "$CRATE_NAME" | cut -c3-4)"
          fi
          if body="$(curl -s --fail --connect-timeout 10 --max-time 20 \
                "https://index.crates.io/${prefix}/${CRATE_NAME}")" \
            && printf '%s' "$body" | jq -e --arg v "$CRATE_VERSION" \
                 'select(.vers == $v)' >/dev/null 2>&1; then
            echo "${CRATE_NAME} ${CRATE_VERSION} is already on crates.io; nothing to do"
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_ENV"
          else
            echo "${CRATE_NAME} ${CRATE_VERSION} is not published yet"
            echo "ALREADY_PUBLISHED=0" >> "$GITHUB_ENV"
          fi

      - name: cargo publish
        if: ${{ env.ALREADY_PUBLISHED != '1' }}
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "$CRATE_NAME" --locked
