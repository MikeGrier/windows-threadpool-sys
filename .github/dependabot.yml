# Keep GitHub Actions and Cargo deps current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    ignore:
      # dtolnay/rust-toolchain's tags are Rust toolchain versions, not action
      # releases; we pin them deliberately (@stable, and @1.98.0 for the MSRV
      # job), so Dependabot's "version" bumps for it are always spurious.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
